# Production phải rebuild image; bind-mount chỉ cho dev.
services:
  cvat_server: &lowram-env
    environment:
      CVAT_ALLOW_STATIC_CACHE: "yes"
      CVAT_CACHE_ITEM_MAX_SIZE: "67108864"
    volumes:
      - ./cvat/apps/engine/default_settings.py:/opt/cvat/cvat/apps/engine/default_settings.py:ro
      - ./cvat/settings/base.py:/opt/cvat/cvat/settings/base.py:ro

  cvat_worker_utils:
    <<: *lowram-env
  cvat_worker_import:
    <<: *lowram-env
  cvat_worker_export:
    <<: *lowram-env
  cvat_worker_annotation:
    <<: *lowram-env
  cvat_worker_webhooks:
    <<: *lowram-env
  cvat_worker_quality_reports:
    <<: *lowram-env
  cvat_worker_chunks:
    <<: *lowram-env
  cvat_worker_consensus:
    <<: *lowram-env
